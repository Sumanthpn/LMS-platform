# Render blueprint for the FastAPI backend.
#
# Render reads this when you create a Blueprint from the repository, so the
# build and start commands do not have to be typed into the dashboard.
#
# The two values marked `sync: false` are deliberately not stored here — Render
# prompts for them on first deploy:
#   MONGODB_URI   the Atlas connection string (contains the database password)
#   CORS_ORIGINS  the deployed frontend origin, which does not exist yet when
#                 the backend is first created
services:
  - type: web
    name: lms-platform-api
    runtime: python
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    # Startup pings MongoDB, so a healthy service also proves the database is reachable.
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.1"
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: lms_platform
      # Generated by Render, so no secret is committed and production never
      # shares a signing key with local development.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE_MINUTES
        value: "10080"
      - key: CORS_ORIGINS
        sync: false
